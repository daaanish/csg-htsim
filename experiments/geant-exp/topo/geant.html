<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Orbitron:wght@400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #050a0f;
            font-family: 'Space Mono', monospace;
            color: #a0d4e8;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        #title {
            position: absolute;
            top: 24px;
            left: 32px;
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #3af0c8;
            opacity: 0.8;
            z-index: 10;
        }

        #hint {
            position: absolute;
            top: 24px;
            right: 32px;
            font-size: 11px;
            color: #4a7a8a;
            text-align: right;
            z-index: 10;
            line-height: 1.8;
        }

        #tt {
            position: absolute;
            background: rgba(5, 15, 22, .95);
            border: 1px solid #3af0c8;
            color: #a0d4e8;
            padding: 8px 14px;
            font-size: 11px;
            pointer-events: none;
            display: none;
            z-index: 100;
            line-height: 1.7;
        }

        svg {
            width: 100%;
            height: 100%;
        }

        .lh {
            stroke: #3af0c8;
            stroke-width: 1.8;
            stroke-opacity: .5;
        }

        .lm {
            stroke: #2288aa;
            stroke-width: 1.1;
            stroke-opacity: .5;
        }

        .ll {
            stroke: #1a5566;
            stroke-width: .7;
            stroke-opacity: .5;
        }

        .grid-l {
            stroke: #0d2030;
            stroke-width: 1;
        }

        .node circle {
            cursor: pointer;
        }

        .node text {
            fill: #a0d4e8;
            pointer-events: none;
            text-anchor: middle;
            dominant-baseline: central;
        }

        #legend {
            position: absolute;
            bottom: 28px;
            left: 32px;
            font-size: 10px;
            color: #4a7a8a;
            z-index: 10;
            line-height: 2;
        }

        .ls {
            display: inline-block;
            width: 18px;
            margin-right: 8px;
            vertical-align: middle;
        }
    </style>
</head>

<body>
    <div id="title">Network Topology — 22 Nodes · 36 Edges</div>
    <div id="hint">
        <div>Drag nodes to reposition</div>
        <div>Hover for details</div>
    </div>
    <div id="tt"></div>
    <div id="legend">
        <div><span class="ls" style="background:#3af0c8;height:2px;"></span>10 Gbps backbone</div>
        <div><span class="ls" style="background:#2288aa;height:1.5px;"></span>2.4 Gbps links</div>
        <div><span class="ls" style="background:#1a5566;height:1px;"></span>155 Mbps links</div>
    </div>
    <svg id="svg">
        <defs>
            <filter id="glow">
                <feGaussianBlur stdDeviation="4" result="b" />
                <feMerge>
                    <feMergeNode in="b" />
                    <feMergeNode in="SourceGraphic" />
                </feMerge>
            </filter>
        </defs>
        <g id="grid"></g>
        <g id="links"></g>
        <g id="nodes"></g>
    </svg>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <script>
        const E = [[1, 3, 1e7], [1, 5, 1e7], [1, 10, 1e7], [1, 16, 24e5], [1, 20, 24e5], [2, 7, 24e5], [2, 14, 155e3], [2, 15, 24e5], [3, 7, 1e7], [3, 13, 1e7], [4, 5, 1e7], [4, 17, 24e5], [4, 21, 24e5], [5, 7, 1e7], [5, 8, 24e5], [5, 11, 24e5], [5, 13, 1e7], [5, 15, 1e7], [5, 19, 1e7], [6, 7, 1e7], [6, 13, 1e7], [6, 18, 24e5], [7, 14, 155e3], [7, 22, 1e7], [8, 13, 24e5], [9, 10, 24e5], [9, 20, 24e5], [10, 21, 24e5], [11, 22, 24e5], [12, 13, 155e3], [12, 15, 155e3], [15, 22, 1e7], [16, 22, 24e5], [17, 19, 1e7], [18, 22, 24e5], [19, 22, 1e7]];
        const deg = {}; for (let i = 1; i <= 22; i++)deg[i] = 0;
        E.forEach(([s, t]) => { deg[s]++; deg[t]++; });
        const nodes = Object.keys(deg).map(id => ({ id: +id, degree: deg[id] }));
        const links = E.map(([source, target, bw]) => ({ source, target, bw }));
        const W = window.innerWidth, H = window.innerHeight;
        const svg = d3.select('#svg');
        const g = d3.select('#grid');
        for (let x = 0; x < W; x += 60)g.append('line').attr('class', 'grid-l').attr('x1', x).attr('x2', x).attr('y1', 0).attr('y2', H);
        for (let y = 0; y < H; y += 60)g.append('line').attr('class', 'grid-l').attr('x1', 0).attr('x2', W).attr('y1', y).attr('y2', y);
        const lc = bw => bw >= 1e7 ? 'lh' : bw >= 24e5 ? 'lm' : 'll';
        const sim = d3.forceSimulation(nodes)
            .force('link', d3.forceLink(links).id(d => d.id).distance(d => d.bw >= 1e7 ? 85 : d.bw >= 24e5 ? 120 : 160).strength(.7))
            .force('charge', d3.forceManyBody().strength(-380))
            .force('center', d3.forceCenter(W / 2, H / 2))
            .force('collision', d3.forceCollide(32));
        const link = d3.select('#links').selectAll('line').data(links).enter().append('line').attr('class', d => lc(d.bw));
        const node = d3.select('#nodes').selectAll('g').data(nodes).enter().append('g').attr('class', 'node')
            .call(d3.drag()
                .on('start', (e, d) => { if (!e.active) sim.alphaTarget(.3).restart(); d.fx = d.x; d.fy = d.y; })
                .on('drag', (e, d) => { d.fx = e.x; d.fy = e.y; })
                .on('end', (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }));
        node.append('circle')
            .attr('r', d => 6 + d.degree * 1.8)
            .attr('fill', d => d.degree >= 7 ? '#0a3040' : d.degree >= 4 ? '#062228' : '#041520')
            .attr('stroke', d => d.degree >= 7 ? '#3af0c8' : d.degree >= 4 ? '#2288aa' : '#1a5566')
            .attr('stroke-width', d => d.degree >= 7 ? 2 : 1.5)
            .attr('filter', d => d.degree >= 6 ? 'url(#glow)' : null);
        node.append('text').text(d => d.id).style('font-size', d => d.degree >= 6 ? '11px' : '9px').style('fill', d => d.degree >= 7 ? '#3af0c8' : '#a0d4e8').style('font-weight', d => d.degree >= 6 ? 700 : 400);
        const tt = document.getElementById('tt');
        const bwFmt = bw => bw >= 1e6 ? (bw / 1e6) + 'G' : (bw / 1e3) + 'M';
        node.on('mouseover', (e, d) => {
            const cs = links.filter(l => l.source.id === d.id || l.target.id === d.id).map(l => `→ Node ${l.source.id === d.id ? l.target.id : l.source.id} [${bwFmt(l.bw)}bps]`).join('<br>');
            tt.innerHTML = `<strong>Node ${d.id}</strong> · ${d.degree} connections<br><br>${cs}`;
            tt.style.display = 'block'; tt.style.left = (e.pageX + 14) + 'px'; tt.style.top = (e.pageY - 10) + 'px';
        }).on('mousemove', e => { tt.style.left = (e.pageX + 14) + 'px'; tt.style.top = (e.pageY - 10) + 'px'; }).on('mouseout', () => tt.style.display = 'none');
        sim.on('tick', () => {
            link.attr('x1', d => d.source.x).attr('y1', d => d.source.y).attr('x2', d => d.target.x).attr('y2', d => d.target.y);
            node.attr('transform', d => `translate(${d.x},${d.y})`);
        });
    </script>
</body>

</html>
